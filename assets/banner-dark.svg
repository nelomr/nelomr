<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Nelo M. — Product Engineer">
  <defs>
    <clipPath id="clip-dark">
      <rect x="0.5" y="0.5" width="1199" height="199" rx="8" />
    </clipPath>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1624" />
      <stop offset="60%" stop-color="#121e30" />
      <stop offset="100%" stop-color="#0f262a" />
    </linearGradient>
  </defs>

  <!-- Background containing colors with zero circular overlays -->
  <g clip-path="url(#clip-dark)">
    <rect width="1200" height="200" fill="url(#bg-dark)" />
  </g>
  <rect x="0.5" y="0.5" width="1199" height="199" rx="8" fill="none" stroke="#253952" stroke-width="1" />

  <!-- Left typography block (No status dot/circle next to the username) -->
  <text x="48" y="46" fill="#889bb0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="0.8">
    @nelomr
  </text>

  <text x="48" y="94" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="-1.2">
    Nelo M.
  </text>

  <text x="48" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
    Product Engineer — SaaS, Web3 &amp; Spec-Driven Development
  </text>

  <!-- Right modular dashboard/graph visual (Totally stripped of circles/dots) -->
  <g>
    <!-- Top-left component card (Emerald label as a small rectangle instead of a dot) -->
    <rect x="856" y="36" width="136" height="42" rx="6" fill="#080f1a" fill-opacity="0.8" stroke="#2c415d" stroke-width="1" />
    <rect x="867" y="47" width="22" height="7" rx="1" fill="#42b883" fill-opacity="0.18" stroke="#42b883" stroke-width="1" />
    <rect x="896" y="48.5" width="46" height="4" rx="1" fill="#e6edf3" opacity="0.9" />
    
    <!-- Flat indicators (using square capsules instead of circles) -->
    <rect x="956" y="48" width="8" height="4" rx="0.5" fill="#58a6ff" opacity="0.8" />
    <rect x="968" y="48" width="8" height="4" rx="0.5" fill="#e3b341" opacity="0.8" />
    <rect x="867" y="63" width="98" height="3" rx="1" fill="#475569" />

    <!-- Bottom-left data trace module (Zero dots, straight data trajectory) -->
    <rect x="856" y="84" width="84" height="42" rx="6" fill="#080f1a" fill-opacity="0.8" stroke="#2c415d" stroke-width="1" />
    <path d="M 866 116 L 878 116 L 888 100 L 900 109 L 912 95 L 928 103 L 928 118 L 866 118 Z" fill="#58a6ff" fill-opacity="0.12" />
    <path d="M 866 116 L 878 116 L 888 100 L 900 109 L 912 95 L 928 103" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Trace cross indicator using pure intersect strokes rather than dots -->
    <path d="M 912 91 V 98 M 908 95 H 915" stroke="#e3b341" stroke-width="1" />

    <!-- Bottom-middle modular grid (No circular node structures) -->
    <rect x="946" y="84" width="46" height="42" rx="6" fill="#080f1a" fill-opacity="0.8" stroke="#2c415d" stroke-width="1" />
    <path d="M 969 95 M 958 113 L 969 95 L 980 113 Z" fill="none" stroke="#42b883" stroke-opacity="0.3" stroke-width="1" />
    <!-- Node connections replaced with miniature squares -->
    <rect x="967.5" y="93.5" width="3" height="3" fill="#e3b341" />
    <rect x="956.5" y="111.5" width="3" height="3" fill="#58a6ff" />
    <rect x="978.5" y="111.5" width="3" height="3" fill="#42b883" />

    <!-- Right spec/SaaS panel (SDD) (No circle badges) -->
    <rect x="998" y="36" width="154" height="90" rx="6" fill="#080f1a" fill-opacity="0.8" stroke="#2c415d" stroke-width="1" />
    <line x1="998" y1="56" x2="1152" y2="56" stroke="#2c415d" stroke-width="1" />
    <rect x="1010" y="45.5" width="38" height="3" rx="1" fill="#94a3b8" />
    <rect x="1116" y="43" width="24" height="6.5" rx="1" fill="#42b883" fill-opacity="0.2" stroke="#42b883" stroke-width="0.9" />

    <!-- Line data (using miniature horizontal dashes instead of dot lists) -->
    <rect x="1010" y="69.5" width="8" height="2" rx="0.5" fill="#42b883" />
    <rect x="1024" y="69" width="84" height="3" rx="1" fill="#cbd5e1" opacity="0.8" />

    <rect x="1010" y="87.5" width="8" height="2" rx="0.5" fill="#42b883" />
    <rect x="1024" y="87" width="102" height="3" rx="1" fill="#cbd5e1" opacity="0.8" />

    <rect x="1010" y="105.5" width="8" height="2" rx="0.5" fill="#e3b341" fill-opacity="0.4" stroke="#e3b341" stroke-width="0.8" />
    <rect x="1024" y="105" width="66" height="3" rx="1" fill="#64748b" />
  </g>

  <!-- Footer spec bar -->
  <line x1="48" y1="150" x2="1152" y2="150" stroke="#263850" stroke-width="1" />

  <text x="48" y="176" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="0.6">
    <tspan fill="#42b883">VUE 3</tspan> · <tspan fill="#e3b341">JAVASCRIPT</tspan> · <tspan fill="#58a6ff">CSS</tspan> · SAAS
  </text>

  <text x="1152" y="176" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="0.6">
    WEB3 · PRODUCT ENGINEERING · <tspan fill="#42b883">SDD</tspan>
  </text>
</svg>